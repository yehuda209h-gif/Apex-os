      setCurrentGoal(ngTitle, ngDate || null);
      if (ngDate) state.venture = Object.assign({}, state.venture, { target_date: ngDate });
      state.nextGoalOpen = false;
      persist();
      // Explicit tap -> ask APEX (existing replan flow) to plan the new goal/cycle.
      openApexWithPrefill(t("next_goal_prefill").replace("{goal}", ngTitle) + (ngDate ? (" (" + ngDate + ")") : ""));
    } else if (action === "edit-field") {
      state.editField = btn.dataset.field;
      render();
      setTimeout(function () { var fe = document.getElementById("fieldEditInput"); if (fe && fe.focus) fe.focus(); }, 0);
    } else if (action === "cancel-field") {
      state.editField = null;
      render();
    } else if (action === "save-field") {
      saveEditedField(btn.dataset.field);
    } else if (action === "kpi-edit") {
      state.kpiEditId = state.kpiEditId === btn.dataset.id ? null : btn.dataset.id;
      state.kpiRemoveId = null;
      render();
    } else if (action === "kpi-edit-cancel") {
      state.kpiEditId = null;
      render();
    } else if (action === "kpi-save") {
      var kaEl = document.getElementById("kpiActual-" + btn.dataset.id);
      var ktEl = document.getElementById("kpiTarget-" + btn.dataset.id);
      updateKpi(btn.dataset.id, kaEl ? kaEl.value : "", ktEl ? ktEl.value : "");
      persist();
      render();
    } else if (action === "kpi-remove") {
      state.kpiRemoveId = btn.dataset.id;
      state.kpiEditId = null;
      render();
    } else if (action === "kpi-remove-cancel") {
      state.kpiRemoveId = null;
      render();
    } else if (action === "kpi-remove-confirm") {
      var rmK = (state.kpis || []).find(function (k) { return k.id === btn.dataset.id; });
      state.kpis = (state.kpis || []).filter(function (k) { return k.id !== btn.dataset.id; });
      state.kpiRemoveId = null;
      if (rmK) addRecentChange("מדד הוסר: " + rmK.name);
      touchActivity();
      persist();
      render();
    } else if (action === "kpi-accept") {
      var cand = kpiCandidates().find(function (c) { return c.key === btn.dataset.key; });
      if (cand) { addKpi({ name: cand.name, unit: cand.unit, target: cand.target, actual: null, source: cand.source }); addRecentChange("נוסף מדד: " + cand.name); }
      persist();
      render();
    } else if (action === "kpi-dismiss") {
      state.kpiDismissed = (state.kpiDismissed || []).concat([btn.dataset.key]).slice(-40);
      persist();
      render();
    } else if (action === "kpi-add-toggle") {
      state.kpiAddOpen = !state.kpiAddOpen;
      render();
    } else if (action === "kpi-add-save") {
      var knEl = document.getElementById("kpiNewName");
      var kName = knEl ? knEl.value.trim() : "";
      if (!kName) return;
      var kuEl = document.getElementById("kpiNewUnit"), kgEl = document.getElementById("kpiNewTarget"), kacEl = document.getElementById("kpiNewActual");
      addKpi({ name: kName, unit: kuEl ? kuEl.value.trim() : "", target: kgEl ? kgEl.value : "", actual: kacEl ? kacEl.value : "", source: "founder" });
      addRecentChange("נוסף מדד: " + kName);
      state.kpiAddOpen = false;
      persist();
      render();
    } else if (action === "health-create-task") {
      // Same confirm-before-apply task path as the bottleneck card.
      var vhD = state.dailyBrief && state.dailyBrief.data && state.dailyBrief.data.venture_health;
      if (vhD && vhD.weekly_step && vhD.weekly_step.title && !vhD.weekly_step_applied) {
        applyAction({ type: "create_task", title: vhD.weekly_step.title, steps: vhD.weekly_step.steps || [] });
        vhD.weekly_step_applied = true;
        addRecentChange('נוצרה משימה מהצעד השבועי (בריאות העסק): ' + vhD.weekly_step.title);
        markVentureEvent("health_action", vhD.weekly_step.title);
      }
      persist();
      render();
    } else if (action === "timeline-more") {
      state.timelineLimit = (state.timelineLimit || 15) + 15;
      render();
    } else if (action === "ask-next-step") {
      if (!state.replanSending) openApexWithPrefill(t("nba_prefill"));
    } else if (action === "close-share") {
      state.shareSheet = null;
      render();
    } else if (action === "share-tpl") {
      state.shareSheet = { template: btn.dataset.tpl };
      render();
    } else if (action === "share-copy") {
      if (state.shareSheet) copyText(buildShareText(state.shareSheet.template));
    } else if (action === "share-native") {
      if (state.shareSheet && navigator.share) {
        var shText = buildShareText(state.shareSheet.template);
        try { navigator.share({ title: "APEX OS", text: shText }).catch(function () {}); } catch (e) {}
      }
    }
  });

  // Inline edit save for the Venture screen (Founder DNA / business profile / overview).
  function saveEditedField(key) {
    if (!state.venture || !key) return;
    var el = document.getElementById("fieldEditInput");
    var raw = el ? String(el.value).trim() : "";
    var at = nowIso();
    var parts = key.split(".");
    var grp = parts[0], fld = parts[1];
    if (grp === "dna") {
      var dna0 = Object.assign({}, state.venture.founder_dna || {});
      dna0[fld] = fld === "hours_per_week" ? (parseFloat(raw) || 0) : raw;
      dna0.updated_at = at;
      state.venture = Object.assign({}, state.venture, { founder_dna: dna0, updated_at: at });
    } else if (grp === "bp") {
      if (BUSINESS_PROFILE_FIELDS.indexOf(fld) === -1) return;
      var bp0 = Object.assign(emptyBusinessProfile(), state.venture.business_profile || {});
      bp0[fld] = raw.slice(0, 600);
      bp0.updated_at = at;
      state.venture = Object.assign({}, state.venture, { business_profile: bp0, updated_at: at });
    } else if (grp === "v") {
      if (fld === "current_goal") {
        var curG = state.venture.current_goal && state.venture.current_goal.title;
        if (raw && raw !== curG) setCurrentGoal(raw, null);
      } else if (fld === "financial_target") {
        var num = parseFloat(raw);
        state.venture = Object.assign({}, state.venture, { financial_target: isNaN(num) ? 0 : num, updated_at: at });
      } else if (fld === "target_date") {
        if (raw && !/^\d{4}-\d{2}-\d{2}$/.test(raw)) return;
        state.venture = Object.assign({}, state.venture, { target_date: raw || state.venture.target_date, updated_at: at });
        if (state.venture.current_goal && raw) state.venture.current_goal = Object.assign({}, state.venture.current_goal, { target_date: raw });
      } else if (fld === "mission") {
        state.venture = Object.assign({}, state.venture, { mission: raw.slice(0, 400), updated_at: at });
      } else { return; }
    } else { return; }
    addRecentChange("עודכן בפרופיל: " + key);
    state.editField = null;
    touchActivity();
    markVentureEvent("venture_change", key);
    persist();
    render();
  }

  document.addEventListener("keydown", function (ev) {
    if (ev.key !== "Enter") return;
    if (ev.target && ev.target.id === "chatInput") {
      ev.preventDefault();
      document.querySelector('[data-action="send"]').click();
    } else if (ev.target && ev.target.id === "replanInput") {
      ev.preventDefault();
      document.querySelector('[data-action="replan-send"]').click();
    } else if (ev.target && ev.target.id === "replanInputOverlay") {
      ev.preventDefault();
      document.querySelector('[data-action="replan-send-overlay"]').click();
    } else if (ev.target && ev.target.id === "decisionInput") {
      ev.preventDefault();
      document.querySelector('[data-action="ask-decision"]').click();
    } else if (ev.target && ev.target.id === "fieldEditInput" && ev.target.tagName !== "TEXTAREA") {
      ev.preventDefault();
      if (state.editField) saveEditedField(state.editField);
    }
  });

  restore();
  render();
  if (state.phase === "dashboard" && state.venture) {
    fetchDailyTipIfNeeded(); fetchWhyMessageIfNeeded(); fetchDailyBriefIfNeeded();
    checkStalledTask();
  }
  checkDeadlines();
  setInterval(function () {
    checkDeadlines();
    if (state.phase === "dashboard" && state.venture) {
      checkStalledTask();          // local only: re-render when aging level changes
      fetchDailyBriefIfNeeded();   // self-gated (date change / pending event + 3h); no call otherwise
    }
  }, 60000);
  initAuth();
  registerServiceWorker();

})();
</script>
</body>
</html>
