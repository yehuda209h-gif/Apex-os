<meta name="theme-color" content="#0F1424">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0F1424; --panel: #171D33; --panelLight: #1F2740; --ink: #F2EFE6;
    --muted: #8A90A6; --gold: #E3A857; --goldDim: #B8863F; --teal: #5FA8A0; --red: #D97A6C;
    /* Layered surface system (Section 19): bg -> surface (cards) -> elevated (nested/expanded) -> active (focused/NOW) */
    --surface: var(--panel);
    --surfaceElevated: #1D2440;
    --surfaceActive: #251E3D;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { font-family: 'Assistant', sans-serif; direction: rtl; }
  #root { min-height: 100vh; }
  input:focus { outline: none; }
  button { font-family: 'Assistant', sans-serif; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--panelLight); border-radius: 3px; }

  .app { background: var(--bg); min-height: 100vh; }
  .wrap { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  .header { padding: 24px 20px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--panelLight); }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-name { font-family: 'Frank Ruhl Libre', serif; font-size: 22px; font-weight: 700; color: var(--ink); }
  .brand-tagline { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .reset-btn { background: transparent; border: 1px solid var(--panelLight); color: var(--muted); border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
  .notif-btn { background: transparent; border: 1px solid var(--goldDim); color: var(--gold); border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
  .pressure-banner { background: rgba(217,122,108,0.12); border: 1px solid rgba(217,122,108,0.5); border-radius: 10px; padding: 10px 14px; color: var(--ink); font-size: 12.5px; line-height: 1.5; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .pressure-banner button { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 13px; flex-shrink: 0; }
  .due-row { margin-top: 10px; padding-right: 30px; display: flex; align-items: center; gap: 6px; }
  .due-input { background: var(--panelLight); border: 1px solid var(--panel); border-radius: 6px; padding: 4px 8px; color: var(--ink); font-size: 12.5px; }
  .due-save { background: var(--teal); border: none; border-radius: 6px; padding: 4px 10px; color: var(--bg); font-weight: 700; font-size: 11.5px; cursor: pointer; }
  .due-set { margin-top: 8px; padding-right: 30px; color: var(--gold); font-size: 12px; }
  .tip-banner { background: rgba(184,134,63,0.08); border: 1px solid rgba(184,134,63,0.3); border-radius: 10px; padding: 10px 14px; color: var(--ink); font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; }
  .tip-banner b { color: var(--gold); }
  .task-card.done { cursor: pointer; }
  .dash-actions { display: flex; gap: 8px; }
  .dash-action-btn { flex: 1; background: var(--panel); border: 1px solid var(--panelLight); color: var(--ink); border-radius: 10px; padding: 9px 0; font-size: 12.5px; cursor: pointer; text-align: center; }
  .review-banner { background: var(--panel); border: 1px solid rgba(184,134,63,0.3); border-radius: 10px; padding: 12px 14px; color: var(--ink); font-size: 13px; line-height: 1.7; white-space: pre-wrap; position: relative; }
  .review-banner b { color: var(--gold); }
  .review-close { position: absolute; top: 8px; left: 10px; background: transparent; border: none; color: var(--muted); font-size: 15px; cursor: pointer; }
  .toast { background: rgba(95,168,160,0.15); border: 1px solid rgba(95,168,160,0.4); border-radius: 8px; padding: 8px 12px; color: var(--ink); font-size: 12.5px; text-align: center; }

  .chat-list { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .bubble { max-width: 85%; border-radius: 14px; padding: 10px 14px; font-size: 14px; line-height: 1.5; color: var(--ink); white-space: pre-wrap; }
  .bubble.user { align-self: flex-start; background: var(--panelLight); }
  .bubble.assistant { align-self: flex-end; background: var(--panel); border: 1px solid rgba(184,134,63,0.2); }
  .thinking { align-self: flex-end; color: var(--muted); font-size: 13px; }

  .chat-input-area { padding: 10px 16px 16px; border-top: 1px solid var(--panelLight); }
  .finalize-btn { width: 100%; margin-bottom: 10px; background: transparent; border: 1px dashed var(--goldDim); color: var(--gold); border-radius: 10px; padding: 9px 0; font-size: 13px; font-weight: 700; cursor: pointer; }
  .finalize-btn:disabled { opacity: 0.5; }
  .input-row { display: flex; gap: 8px; }
  .text-input { flex: 1; background: var(--panelLight); border: 1px solid var(--panel); border-radius: 10px; padding: 12px 14px; color: var(--ink); font-size: 15px; }
  .send-btn { background: var(--gold); border: none; border-radius: 10px; width: 46px; cursor: pointer; font-size: 18px; }
  .send-btn:disabled { opacity: 0.6; }

  .dash { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
  .venture-label { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .venture-title { font-family: 'Frank Ruhl Libre', serif; font-size: 22px; font-weight: 700; color: var(--ink); }
  .why-banner { background: rgba(95,168,160,0.08); border: 1px solid rgba(95,168,160,0.27); border-radius: 10px; padding: 10px 14px; color: var(--ink); font-size: 12.5px; line-height: 1.5; }
  .why-banner b { color: var(--teal); }
  .brief-card { background: var(--panel); border: 1px solid rgba(184,134,63,0.35); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .brief-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; color: var(--gold); }
  .brief-score { font-size: 11px; color: var(--muted); font-weight: 400; }
  .brief-row { font-size: 12.5px; color: var(--ink); line-height: 1.5; }
  .brief-row b { color: var(--muted); font-weight: 700; }
  .brief-rec b { color: var(--gold); }
  .decision-section { background: rgba(95,168,160,0.05); border: 1px solid rgba(95,168,160,0.25); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .decision-title { color: var(--teal); font-size: 13px; font-weight: 700; }
  .decision-card { background: var(--panel); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
  .decision-badge { display: inline-block; border-radius: 6px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
  .decision-badge.proceed { background: rgba(95,168,160,0.2); color: var(--teal); }
  .decision-badge.wait { background: rgba(227,168,87,0.2); color: var(--gold); }
  .decision-badge.test { background: rgba(227,168,87,0.2); color: var(--gold); }
  .decision-badge.reject { background: rgba(217,122,108,0.2); color: var(--red); }
  .decision-badge.reconsider { background: rgba(138,144,166,0.2); color: var(--muted); }
  .decision-conf { font-size: 11px; color: var(--muted); }
  .decision-reason { font-size: 12.5px; color: var(--ink); line-height: 1.5; }
  .decision-apply-btn { align-self: flex-start; background: var(--teal); border: none; border-radius: 8px; padding: 6px 12px; color: var(--bg); font-weight: 700; font-size: 12px; cursor: pointer; }

  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; background: var(--panel); border-top: 1px solid var(--panelLight); display: flex; padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 40; }
  .nav-btn { flex: 1; background: transparent; border: none; color: var(--muted); padding: 8px 0 6px; font-size: 10.5px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .nav-btn.active { color: var(--gold); }
  .nav-icon { font-size: 18px; }
  .dash { padding-bottom: 70px !important; }
  .focus-card { background: var(--surfaceActive); border: 1px solid rgba(184,134,63,0.5); border-radius: 14px; padding: 18px 16px; display: flex; flex-direction: column; gap: 10px; }
  .focus-label { color: var(--gold); font-size: 12.5px; font-weight: 700; letter-spacing: 0.2px; }
  .focus-title { color: var(--ink); font-size: 20px; font-weight: 800; line-height: 1.35; }
  .focus-steps { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .focus-steps .task-step { color: var(--ink); font-size: 14.5px; line-height: 1.6; opacity: 0.92; }
  .bottleneck-card { background: rgba(217,122,108,0.08); border: 1px solid rgba(217,122,108,0.35); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .bottleneck-label { color: var(--red); font-size: 12px; font-weight: 700; }
  .bottleneck-card.bottleneck-ok { background: rgba(108,180,140,0.08); border-color: rgba(108,180,140,0.35); }
  .bottleneck-card.bottleneck-ok .bottleneck-label { color: #6cb48c; font-weight: 600; }
  .bottleneck-card.bottleneck-watch { background: rgba(224,178,80,0.08); border-color: rgba(224,178,80,0.35); }
  .bottleneck-card.bottleneck-watch .bottleneck-label { color: #e0b250; }
  .bottleneck-card.bottleneck-block { background: rgba(217,122,108,0.08); border-color: rgba(217,122,108,0.35); }
  .bottleneck-card.bottleneck-block .bottleneck-label { color: var(--red); }
  .why-compact { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .why-compact-full { background: var(--surfaceElevated); border: 1px solid rgba(95,168,160,0.27); border-radius: 10px; padding: 10px 14px; color: var(--ink); font-size: 12.5px; line-height: 1.5; margin-top: 6px; }
  .why-compact-visible { display: flex; align-items: flex-start; gap: 6px; font-size: 12.5px; color: var(--muted); background: rgba(95,168,160,0.06); border-radius: 10px; padding: 8px 12px; line-height: 1.5; }
  .why-compact-visible .why-text { color: var(--ink); }
  .now-title { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.2px; margin-top: 2px; }
  .focus-steps-count { font-size: 11.5px; color: var(--muted); }
  .task-flash { background: rgba(227,168,87,0.14); border: 1px solid rgba(184,134,63,0.55); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; animation: flashIn 0.35s ease; }
  .task-flash-title { font-size: 15px; font-weight: 800; color: var(--gold); }
  .task-flash-body { font-size: 13px; color: var(--ink); opacity: 0.9; }
  .task-flash-week { font-size: 12px; color: var(--teal); font-weight: 600; }
  .task-flash-continue { align-self: flex-start; margin-top: 4px; background: var(--gold); color: #1b1509; border: none; border-radius: 10px; padding: 8px 16px; font-size: 13px; font-weight: 700; cursor: pointer; }
  @keyframes flashIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  .brief-card.brief-compact { padding: 10px 14px; }
  .progress-compact { background: var(--panel); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .progress-bar-track { background: var(--panelLight); border-radius: 6px; height: 8px; overflow: hidden; }
  .progress-bar-fill { background: var(--gold); height: 100%; border-radius: 6px; }
  .progress-meta { font-size: 11.5px; color: var(--muted); }
  .decision-preview { background: var(--panel); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .more-list { display: flex; flex-direction: column; gap: 8px; }
  .more-item { background: var(--panel); border: 1px solid var(--panelLight); border-radius: 10px; padding: 12px 14px; color: var(--ink); font-size: 14px; cursor: pointer; text-align: start; }
  .more-lang-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .more-lang-label { font-size: 12.5px; color: var(--muted); flex: 1; }
  .lang-btn { background: var(--panel); border: 1px solid var(--panelLight); border-radius: 8px; padding: 6px 10px; color: var(--muted); font-size: 12.5px; cursor: pointer; }
  .lang-btn.active { border-color: var(--gold); color: var(--gold); font-weight: 700; }
  .screen-title { font-family: 'Frank Ruhl Libre', serif; font-size: 19px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }

  .welcome-screen { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .welcome-pitch { font-size: 15px; line-height: 1.6; color: var(--ink); }
  .welcome-preview-title { font-size: 13px; font-weight: 700; color: var(--gold); }
  .welcome-preview-grid { display: flex; flex-direction: column; gap: 8px; }
  .welcome-preview-card { background: var(--panel); border: 1px solid var(--panelLight); border-radius: 10px; padding: 10px 12px; }
  .wp-label { font-size: 12.5px; font-weight: 700; color: var(--ink); margin-bottom: 3px; }
  .wp-ex { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .welcome-start-btn { background: var(--gold); border: none; border-radius: 10px; padding: 14px; color: var(--bg); font-weight: 800; font-size: 15px; cursor: pointer; }

  .quick-choice-block { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .quick-choice-prompt { font-size: 12.5px; color: var(--muted); }
  .quick-choice-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .quick-choice-btn { background: var(--panel); border: 1px solid var(--panelLight); border-radius: 20px; padding: 7px 12px; color: var(--ink); font-size: 12.5px; cursor: pointer; }
  .quick-choice-free { font-size: 11px; color: var(--muted); opacity: 0.8; }
  .onboarding-topbar { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 0; }
  .back-btn { background: transparent; border: none; color: var(--muted); font-size: 12.5px; cursor: pointer; padding: 4px 0; }
  .onboarding-dots { display: flex; gap: 5px; }
  .ob-dot { font-size: 8px; color: var(--panelLight); }
  .ob-dot.filled { color: var(--gold); }

  .small-win-card { background: rgba(227,168,87,0.1); border: 1px solid rgba(184,134,63,0.5); border-radius: 12px; padding: 14px; margin: 8px 0; display: flex; flex-direction: column; gap: 6px; }
  .small-win-title { font-size: 15px; font-weight: 800; color: var(--ink); margin-bottom: 4px; }
  .small-win-row { font-size: 13px; color: var(--ink); line-height: 1.5; }
  .small-win-continue-btn { align-self: flex-start; margin-top: 6px; background: var(--teal); border: none; border-radius: 8px; padding: 8px 14px; color: var(--bg); font-weight: 700; font-size: 12.5px; cursor: pointer; }

  .map-ready-screen { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .map-ready-title { font-family: 'Frank Ruhl Libre', serif; font-size: 22px; font-weight: 700; color: var(--ink); }
  .map-ready-row { background: var(--panel); border-radius: 10px; padding: 10px 12px; }
  .mr-label { font-size: 12px; font-weight: 700; color: var(--gold); margin-bottom: 3px; }
  .mr-val { font-size: 13.5px; color: var(--ink); line-height: 1.5; }
  .map-ready-btn { background: var(--gold); border: none; border-radius: 10px; padding: 14px; color: var(--bg); font-weight: 800; font-size: 15px; cursor: pointer; }

  .progress-center { background: var(--panel); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .progress-center-head { font-size: 13px; font-weight: 700; color: var(--ink); }
  .stage-track { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
  .stage-step.current { color: var(--gold); font-weight: 700; }
  .stage-step.done { color: var(--teal); }
  .stage-arrow { opacity: 0.4; }
  .next-milestone-row { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
  .nm-label { font-size: 11px; color: var(--muted); }
  .nm-val { font-size: 13.5px; font-weight: 700; color: var(--ink); }
  .weekly-momentum { color: var(--teal); }

  .metrics-row { display: flex; gap: 10px; }
  .ring-card { flex: 1; background: var(--panel); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .ring-label { color: var(--muted); font-size: 11px; }
  .metric-cards { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .metric-card { background: var(--panel); border-radius: 12px; padding: 10px 12px; }
  .metric-card-label { color: var(--muted); font-size: 11px; }
  .metric-card-value { color: var(--ink); font-size: 15px; font-weight: 700; margin-top: 2px; }

  .tasks-title { color: var(--ink); font-size: 14px; font-weight: 700; margin-bottom: 10px; }
  .tasks-list { display: flex; flex-direction: column; gap: 8px; }
  .task-card { background: var(--panel); border: 1px solid transparent; border-radius: 10px; padding: 12px 14px; }
  .task-card.active { background: rgba(227,168,87,0.08); border: 1px solid rgba(184,134,63,0.47); }
  .task-card.locked { opacity: 0.45; padding: 8px 14px; }
  .task-top { display: flex; align-items: center; gap: 10px; }
  .task-title { flex: 1; color: var(--ink); font-size: 14.5px; line-height: 1.5; }
  .task-title.active { font-size: 16.5px; font-weight: 700; line-height: 1.45; }
  .task-title.done { color: var(--muted); text-decoration: line-through; }
  .task-done-btn { background: var(--teal); border: none; border-radius: 8px; padding: 6px 10px; color: var(--bg); font-weight: 700; font-size: 12px; cursor: pointer; flex-shrink: 0; }
  .task-reopen-btn { margin-top: 10px; margin-right: 30px; background: transparent; border: 1px solid var(--muted); border-radius: 8px; padding: 6px 12px; color: var(--ink); font-weight: 600; font-size: 12.5px; cursor: pointer; }
  .task-steps { margin-top: 10px; padding-right: 30px; display: flex; flex-direction: column; gap: 5px; }
  .task-step { color: var(--ink); opacity: 0.85; font-size: 13.5px; line-height: 1.6; }
  .task-links { margin-top: 8px; padding-right: 30px; display: flex; flex-wrap: wrap; gap: 6px; }
  .task-link { background: var(--panelLight); color: var(--teal); font-size: 11.5px; border-radius: 6px; padding: 3px 8px; text-decoration: none; }

  .replan-panel { background: rgba(227,168,87,0.055); border: 1px solid rgba(184,134,63,0.27); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .replan-title-row { display: flex; justify-content: space-between; align-items: center; }
  .replan-title { color: var(--gold); font-size: 13px; font-weight: 700; }
  .replan-expand-btn { background: transparent; border: 1px solid rgba(184,134,63,0.4); color: var(--gold); border-radius: 6px; padding: 3px 8px; font-size: 11.5px; cursor: pointer; }
  .replan-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .replan-overlay { position: fixed; inset: 0; background: var(--surfaceElevated); z-index: 60; display: flex; flex-direction: column; padding: 16px; max-width: 480px; margin: 0 auto; }
  .replan-overlay-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-shrink: 0; }
  .replan-overlay-close { background: var(--panel); border: 1px solid var(--panelLight); color: var(--ink); border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .replan-overlay-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 10px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .modal-box { background: var(--panel); border: 1px solid rgba(184,134,63,0.33); border-radius: 14px; padding: 22px; max-width: 340px; width: 100%; }
  .modal-head { display: flex; align-items: center; gap: 8px; color: var(--red); margin-bottom: 10px; font-weight: 700; font-size: 16px; }
  .modal-head span.title { color: var(--ink); }
  .modal-body { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 18px; }
  .modal-actions { display: flex; gap: 10px; }
  .modal-cancel { flex: 1; background: var(--panelLight); border: none; border-radius: 8px; padding: 10px 0; color: var(--ink); font-size: 14px; cursor: pointer; }
  .modal-confirm { flex: 1; background: var(--red); border: none; border-radius: 8px; padding: 10px 0; color: var(--bg); font-weight: 700; font-size: 14px; cursor: pointer; }

  /* ---- Bottleneck Engine (actionable detail) ---- */
  .bottleneck-detail { background: var(--surfaceElevated); border-radius: 10px; padding: 10px 12px; margin-top: 4px; display: flex; flex-direction: column; gap: 6px; }
  .bottleneck-detail-row { font-size: 12.5px; color: var(--ink); line-height: 1.5; }
  .bottleneck-detail-row b { color: var(--muted); font-weight: 700; }
  .bottleneck-detail-actions { display: flex; gap: 8px; margin-top: 4px; }

  /* ---- Outcome Engine (expected vs actual capture) ---- */
  .outcome-toggle { align-self: flex-start; background: transparent; border: 1px dashed var(--goldDim); color: var(--gold); border-radius: 8px; padding: 5px 10px; font-size: 11.5px; cursor: pointer; margin-top: 2px; }
  .outcome-form { background: var(--surfaceElevated); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .outcome-form label { font-size: 11.5px; color: var(--muted); }
  .outcome-form textarea, .outcome-form input[type=text] { background: var(--panelLight); border: 1px solid var(--panel); border-radius: 6px; padding: 6px 8px; color: var(--ink); font-size: 12.5px; font-family: inherit; resize: vertical; min-height: 32px; }
  .outcome-form-actions { display: flex; gap: 8px; margin-top: 2px; }
  .outcome-save-btn { flex: 1; background: var(--teal); border: none; border-radius: 8px; padding: 7px 0; color: var(--bg); font-weight: 700; font-size: 12px; cursor: pointer; }
  .outcome-skip-btn { flex: 1; background: transparent; border: 1px solid var(--panelLight); border-radius: 8px; padding: 7px 0; color: var(--muted); font-size: 12px; cursor: pointer; }
  .outcome-recorded { font-size: 12px; color: var(--teal); background: rgba(95,168,160,0.08); border-radius: 8px; padding: 6px 10px; margin-top: 4px; }

  /* ---- Decision Ledger outcome recording ---- */
  .decision-outcome { background: var(--surfaceElevated); border-radius: 8px; padding: 8px 10px; margin-top: 2px; font-size: 12px; color: var(--ink); line-height: 1.5; }
  .decision-outcome b { color: var(--muted); }

  /* ---- PWA update banner ---- */
  .update-banner { background: rgba(227,168,87,0.14); border: 1px solid rgba(184,134,63,0.55); border-radius: 10px; padding: 10px 14px; color: var(--ink); font-size: 12.5px; line-height: 1.5; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .update-banner-btn { background: var(--gold); border: none; border-radius: 8px; padding: 7px 12px; color: #1b1509; font-weight: 700; font-size: 12px; cursor: pointer; flex-shrink: 0; min-height: 40px; }

  /* ---- v1.2.0: shared close "×" (all dismissible cards / banners / overlays) ---- */
  .has-x { position: relative; padding-inline-end: 46px !important; }
  button.x-btn { position: absolute; top: 4px; inset-inline-end: 4px; width: 40px; height: 40px; min-width: 40px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent;
    border-radius: 10px; color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; font-family: inherit; z-index: 1; }
  button.x-btn:hover { color: var(--ink); background: rgba(255,255,255,0.05); }
  button.x-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; color: var(--ink); }
  button.x-btn.x-inline { position: static; flex-shrink: 0; }
  /* ---- v1.2.0: shared back button (non-home screens, sub-views, overlays) ---- */
  .nav-back-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; min-width: 40px; padding: 0 12px;
    background: transparent; border: 1px solid var(--panelLight); border-radius: 10px; color: var(--ink); font-size: 13px;
    font-family: inherit; cursor: pointer; flex-shrink: 0; }
  .nav-back-btn span[aria-hidden] { font-size: 16px; line-height: 1; color: var(--gold); }
  .nav-back-btn:hover { background: var(--panel); }
  .nav-back-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  .screen-head { display: flex; align-items: center; gap: 10px; }
  .screen-head .screen-title { margin-bottom: 0; }
  .replan-overlay-header { gap: 8px; }
  .replan-overlay-header .replan-title { flex: 1; }
  .map-ready-screen.has-x { position: relative; }
  .map-ready-screen.has-x > .x-btn { top: 10px; }

  /* ---- v1.2.0: retry ---- */
  .retry-btn { align-self: flex-end; min-height: 40px; padding: 0 14px; background: transparent; border: 1px solid var(--goldDim);
    color: var(--gold); border-radius: 10px; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; }
  .retry-btn:disabled { opacity: 0.6; cursor: default; }
  .retry-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  .decision-card .retry-btn, .review-banner .retry-btn { align-self: flex-start; margin-top: 6px; }
  .bubble.bubble-error { border-color: rgba(217,122,108,0.45); }

  /* ---- v1.2.0: chips, aging, stuck, reminder, replan suggestion ---- */
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip-btn { min-height: 40px; padding: 0 14px; background: var(--panelLight); border: 1px solid var(--panelLight); color: var(--ink);
    border-radius: 10px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; }
  .chip-btn.chip-primary { background: var(--teal); border-color: var(--teal); color: var(--bg); font-weight: 700; }
  .chip-btn:disabled { opacity: 0.55; cursor: default; }
  .chip-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  .aging-line { font-size: 12px; color: var(--muted); }
  .aging-line.aging-stuck { color: #e0b250; }
  .stuck-card { background: rgba(224,178,80,0.08); border: 1px solid rgba(224,178,80,0.4); border-radius: 12px; padding: 12px 14px; margin-top: -8px; }
  .stuck-text, .reminder-text, .suggest-text { font-size: 13px; color: var(--ink); line-height: 1.5; }
  .reminder-card { background: rgba(227,168,87,0.1); border: 1px solid rgba(184,134,63,0.5); border-radius: 12px; padding: 12px 14px; }
  .suggest-card { background: rgba(95,168,160,0.08); border: 1px solid rgba(95,168,160,0.4); border-radius: 12px; padding: 12px 14px; }

  /* ---- v1.2.0: in-app reminders toggle ---- */
  .reminder-toggle { display: flex; flex-direction: column; gap: 3px; min-height: 48px; }
  .reminder-toggle .rt-main { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; }
  .more-sub { font-size: 11.5px; color: var(--muted); }
  .toggle-pill { width: 40px; height: 22px; border-radius: 11px; background: var(--panelLight); position: relative; flex-shrink: 0; transition: background 0.15s; }
  .toggle-knob { position: absolute; top: 3px; inset-inline-start: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: inset-inline-start 0.15s, background 0.15s; }
  .toggle-pill.on { background: rgba(95,168,160,0.45); }
  .toggle-pill.on .toggle-knob { inset-inline-start: 21px; background: var(--teal); }
  .reminder-toggle:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }

  /* ==== v1.3.0: Mission Control (Progress), Venture page, KPIs, Health, Share, Tools ====
     Readability (spec #32): body text >= 13px in --ink; secondary >= 12px in --muted2 (higher
     contrast than --muted on the elevated surfaces); sections separated by border + surface
     layer; every control >= 40px. */
  :root { --muted2: #A3A9BD; --green: #6cb48c; --yellow: #e0b250; --line: #2A3354; }
  .soft-note { font-size: 12.5px; color: var(--muted2); line-height: 1.55; }
  .empty-state { font-size: 13px; color: var(--muted2); line-height: 1.6; background: var(--surfaceElevated); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; }
  .est-tag { display: inline-block; font-size: 11px; color: var(--yellow); border: 1px solid rgba(224,178,80,0.45); border-radius: 6px; padding: 0 6px; margin-inline-start: 4px; vertical-align: middle; }
  .screen-head .head-action { margin-inline-start: auto; }
  .screen-head .screen-title { flex: 1; min-width: 0; }
  .link-btn { background: transparent; border: none; color: var(--gold); font-size: 12.5px; font-weight: 700; font-family: inherit; cursor: pointer; min-height: 40px; padding: 0 4px; }
  .link-btn:focus-visible, .ghost-btn:focus-visible, .mc-head:focus-visible, .icon-btn:focus-visible, .tool-tile:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  .progress-center-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .dot-badge { color: var(--gold); font-size: 18px; line-height: 0; }
  .ghost-btn { align-self: flex-start; min-height: 40px; padding: 0 14px; background: transparent; border: 1px solid var(--line); border-radius: 10px; color: var(--ink); font-size: 13px; font-family: inherit; cursor: pointer; }
  .chip-btn.chip-danger { background: var(--red); border-color: var(--red); color: var(--bg); font-weight: 700; }
  .chip-btn.chip-wa { display: inline-flex; align-items: center; text-decoration: none; background: rgba(108,180,140,0.16); border-color: rgba(108,180,140,0.55); color: var(--ink); }
  .icon-btn { width: 40px; height: 40px; min-width: 40px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid var(--line); border-radius: 10px; color: var(--muted2); font-size: 15px; cursor: pointer; font-family: inherit; }
  .icon-btn:hover { color: var(--ink); background: var(--panelLight); }

  .mc-section { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .mc-head { width: 100%; min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 14px; background: transparent; border: none; color: var(--ink); font-family: inherit; cursor: pointer; text-align: start; }
  .mc-title { font-size: 14px; font-weight: 700; }
  .mc-chev { color: var(--muted2); font-size: 14px; }
  .mc-body { padding: 2px 14px 14px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
  .mc-section.collapsed .mc-head { opacity: 0.92; }

  .stage-track.big { font-size: 12.5px; gap: 6px; }
  .stage-track.big .stage-step { padding: 4px 8px; border-radius: 8px; background: var(--surfaceElevated); }
  .stage-track.big .stage-step.current { background: rgba(227,168,87,0.16); }
  .cycle-track .stage-step.current { color: var(--gold); font-weight: 700; }
  .cycle-loop { color: var(--teal); opacity: 0.9 !important; font-size: 14px; }
  .lc-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .lc-badge { display: inline-block; font-size: 12.5px; font-weight: 700; color: var(--ink); background: var(--surfaceActive); border: 1px solid rgba(184,134,63,0.45); border-radius: 999px; padding: 3px 10px; }

  .meter { display: flex; flex-direction: column; gap: 5px; }
  .meter-top { display: flex; justify-content: space-between; align-items: baseline; }
  .meter-label { font-size: 13px; color: var(--ink); font-weight: 600; }
  .meter-val { font-size: 18px; font-weight: 800; color: var(--gold); font-family: 'Frank Ruhl Libre', serif; }
  .meter-sub { font-size: 12px; color: var(--muted2); line-height: 1.5; }
  .progress-bar-track.thin { height: 5px; }
  .progress-bar-fill.full { background: var(--green); }
  .nba-title { font-size: 16px; font-weight: 800; color: var(--ink); line-height: 1.4; }
  .stat-row { display: flex; gap: 10px; }
  .stat { flex: 1; background: var(--surfaceElevated); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 2px; }
  .stat-num { font-size: 22px; font-weight: 800; color: var(--ink); font-family: 'Frank Ruhl Libre', serif; }
  .stat-lbl { font-size: 12px; color: var(--muted2); }

  .health-list { display: flex; flex-direction: column; gap: 2px; }
  .health-row { display: grid; grid-template-columns: 24px 84px 1fr; align-items: start; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .health-row:last-child { border-bottom: none; }
  .health-dot { font-size: 14px; line-height: 1.5; }
  .health-cat { font-size: 13px; font-weight: 700; color: var(--ink); line-height: 1.5; }
  .health-note { font-size: 12.5px; color: var(--muted2); line-height: 1.5; }
  .health-blocker { font-size: 13px; color: var(--ink); background: rgba(217,122,108,0.1); border: 1px solid rgba(217,122,108,0.4); border-radius: 10px; padding: 9px 12px; line-height: 1.55; }
  .health-blocker b { color: var(--red); }
  .health-step { background: var(--surfaceElevated); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
  .health-step-title { font-size: 14px; font-weight: 700; color: var(--ink); }

    '- **אם ליזם יש כמה רעיונות ביחד, או שהוא לא סגור על מיזם אחד** - זה בדיוק המקום שלך לפעול כיועץ החלטות: תבקש ממנו לפרוש את כל הרעיונות, ותעזור לו להשוות ביניהם **בהתאם ל-DNA שאספת** (הון זמין, שעות פנויות, כישורים ורקע, סיכון מותר) - תסביר לכל רעיון מה היתרון/חיסרון היחסי שלו *עבורו באופן ספציפי*, ותוביל אותו להחלטה מנומקת אחת. אל תבחר בשבילו - תעזור לו לבחור בעצמו עם נימוקים ברורים.\n' +
    '- הצלב את הרעיון הנבחר מול ה-DNA שאספת: אם הוא לא מתאים למשאבים/לכישורים/לזמן הפנוי - תגיד את זה ישירות ותסביר למה, ותציע כיוון שמנצל את היתרון היחסי שלו. זו החלטת Go/No-Go אמיתית.\n' +
    '- יש לך גישה לחיפוש אינטרנט אמיתי בזמן אמת. השתמש בו כדי לבדוק גודל שוק, מתחרים אמיתיים, טווחי מחירים, או רגולציה רלוונטית - כשזה חשוב להחלטה. אל תמציא מספרים - אם אתה לא בטוח וזה לא קריטי, תגיד שזה הערכה גסה במקום להציג בדיה כעובדה.\n' +
    '- השיחה יכולה להימשך כמה שצריך - אין לך מגבלת מספר הודעות.\n\n' +
    'חוק ברזל - אסור לך לסגור את האפיון ולפלוט תוכנית סופית ביוזמתך, לעולם. גם אם נראה לך שיש לך כבר את כל הפרטים.\n' +
    'הדרך היחידה לפלוט תוכנית סופית היא כאשר ההודעה האחרונה של המשתמש היא בקשה מפורשת לסגור את האפיון ולעבור לביצוע (תכיל את המילה "סגירת אפיון" או ביטוי דומה).\n' +
    'כשזה קורה:\n' +
    '- אם באמת יש לך מספיק מידע (כותרת ברורה, תאריך יעד, ה"למה" האישי, שם היזם, ומספיק הבנה של המיזם) - סכם בחום במשפט אחד עם החלטת ה-Go/No-Go, ואז בשורה נפרדת בסוף ההודעה פלוט *אך ורק פעם אחת* תגית מדויקת (בלי טקסט נוסף בתוכה):\n' +
    '<VENTURE>{"title":"...", "target_date":"YYYY-MM-DD", "financial_target":0, "financial_unit":"...", "core_why":"...", "founder_name":"...", "founder_dna":{"capital":"...","skills":"...","experience":"...","hours_per_week":0,"risk_tolerance":"...","constraints":"..."}, "lifecycle_stage":"idea|building|launched|established|growth|turnaround|pivot", "venture_kind":"new_venture|whole_business|new_product|new_branch|sales_channel|campaign|ops_change", "mission":"משפט אחד - מה אנחנו רוצים להשיג", "current_goal":"היעד הנוכחי הממוקד", "business_profile":{"business_type":"","years_active":"","offering":"","customers":"","revenue":"","profitability":"","team":"","marketing":"","sales":"","operations":"","problems":"","bottlenecks":"","goals":"","what_works":"","what_doesnt":"","wants_to_change":""}, "tasks":[{"title":"...", "steps":["צעד אטומי 1 (15-30 דק\')","צעד אטומי 2","..."], "links":[{"label":"...", "url":"..."}]}]}</VENTURE>\n' +
    'שדה founder_dna ממלאים לפי מה שהיזם ענה בשלב א (הון זמין, כישורים/רקע, שעות שבועיות, נכונות לסיכון) - בקצרה, hours_per_week כמספר. אם משהו לא נאמר במפורש, השאר ריק/0 ואל תמציא.\n' +
    'lifecycle_stage הוא השלב האמיתי של העסק/המיזם לפי השיחה (לא לפי ברירת מחדל). business_profile ממלאים רק כשיש עסק קיים ורק במה שנאמר; אחרת השאר את השדות ריקים. ' +
    'בעסק קיים: title = שם העסק + היעד/המיקוד הנוכחי, target_date = תאריך היעד של המיקוד הנוכחי, ורשימת המשימות מתמקדת בשיפור/בקידום החשוב ביותר עכשיו (לא בהקמה, לא ברישום עסק ולא באימות רעיון).\n' +
    '- אם עדיין חסר משהו קריטי (בעיקר שם, כותרת ברורה, תאריך יעד, או ה"למה" האישי) - אל תפלוט תגית. במקום זה תגיד בקצרה מה עוד חסר ותשאל את זה.\n\n' +
    'בניית רשימת המשימות (tasks), כשמגיע הרגע:\n' +
    '- מספר המשימות אינו קבוע - הוא נגזר מהמורכבות האמיתית של המיזם הספציפי הזה (יכול להיות 5, יכול להיות 16). אל תיצור מספר עגול "כי ככה מקובל".\n' +
    '- המשימות חייבות לשקף את המציאות בשטח של המיזם הזה בדיוק - כולל משימות תפעוליות, מול ספקים, רגולציה/רישוי אם רלוונטי, ניהול סיכונים - לא רשימה גנרית. איסור מוחלט על כותרות משימה כלליות כמו "תעשה שיווק" בלי פירוק.\n' +
    '- לכל משימה: "steps" הוא פירוק ל-2-5 צעדים אטומיים וקונקרטיים, כל צעד ניתן לביצוע ב-15-30 דקות.\n' +
    '- "links" אופציונלי - רק אם יש כלי/אתר חיצוני ספציפי ורלוונטי באמת; אם אין קישור אמיתי, השאר מערך ריק.\n' +
    '- סדר המשימות הגיוני - מה שחייב לקרות קודם, קודם.\n\n' +
    'גבולות אחריות - חשוב מאוד:\n' +
    '- אל תיתן ייעוץ פיננסי, משפטי, מיסויי או רגולטורי מחייב (למשל: "בטוח שזה חוקי", "תעשה את זה ותחסוך מס") - במקרים כאלה תמליץ בפירוש להתייעץ עם רואה חשבון/עורך דין מוסמך, ותסביר בקצרה למה זה חשוב.\n' +
    '- אל תבקש ולא תעודד את היזם לשתף מספרי זהות, פרטי כרטיס אשראי, סיסמאות, או מידע רגיש אחר שלא נחוץ לתוכנית העבודה.\n\n' +
    'תשובות שיחה רגילות קצרות (2-5 משפטים). אל תשתמש בפורמט Markdown (כוכביות להדגשה, כותרות עם #, רשימות עם מקפים) - כתוב טקסט רגיל בלבד, גם כשאתה רוצה להדגיש משהו.';

  // ---- Context Engine (Section 8) ----
  // Single source of truth for "what APEX knows" - every AI call site (onboarding,
  // decision engine, daily brief, replan, why-message) builds its prompt through
  // this function instead of assembling context ad hoc, so the agent's answers
  // ("how am I doing?") reflect the venture's actual state (Section 9) rather than
  // being generic. It reads state.tasks / state.dailyBrief / state.outcomes
  // directly (closure-scoped) so every call site gets the fuller context below
  // automatically, with no call-site changes required - which also keeps this
  // extendable without touching the onboarding/decision/replan prompt builders.
  //
  // Section 10 (voice-agent prep, not built): this function and applyAction()/
  // AUTO_ACTIONS (the agent's "tools") are intentionally decoupled from any
  // chat-UI-specific code - they take plain data in, return plain text/JSON out.
  // A future voice UI could call buildAPEXContext() + the same action layer
  // without any rearchitecting.
  // Section 11 (future voice capabilities, documentation only): status-by-voice,
  // "did I finish X", "what's blocking me", updating a task by voice. The
  // intended flow for new info arriving by voice: identify new info -> append to
  // venture.knowledge/unknowns (see addUnknowns/addRecentChange below) -> if it
  // contradicts a stored decision, flag it for the Decision Ledger -> propose a
  // plan change -> ask for confirmation (never mutate silently - see Section 12
  // / the confirm-before-apply note on applyAction()).
  function buildAPEXContext(venture, decisions, purpose) {
    var lines = [];
    if (venture.founder_name) lines.push('שם היזם: ' + venture.founder_name);
    if (venture.entry_state) lines.push('נקודת הפתיחה שממנה היזם התחיל: ' + venture.entry_state);
    if (venture.core_why) lines.push('הסיבה האישית שלו להצליח: ' + venture.core_why);
    var dna = venture.founder_dna;
    if (dna) {
      var dnaBits = [];
      if (dna.capital) dnaBits.push('הון זמין: ' + dna.capital);
      if (dna.skills) dnaBits.push('כישורים/רקע: ' + dna.skills);
      if (dna.hours_per_week) dnaBits.push('שעות פנויות בשבוע: ' + dna.hours_per_week);
      if (dna.risk_tolerance) dnaBits.push('נכונות לסיכון: ' + dna.risk_tolerance);
      if (dna.experience) dnaBits.push('ניסיון: ' + dna.experience);
      if (dna.constraints) dnaBits.push('אילוצים: ' + dna.constraints);
      if (dnaBits.length) lines.push('נתוני היזם (DNA): ' + dnaBits.join(" | "));
    }
    // ---- v1.3.0 lifecycle: stage / focus / business profile / goal ----
    var lc = lifecycleOf(venture);
    lines.push('שלב מחזור החיים הנוכחי: ' + lc + (isBusinessStage(lc) ? ' (עסק פעיל - חשוב ניהול, אופטימיזציה וצמיחה, לא הקמה)' : '') + (venture.lifecycle_stage_inferred ? ' (הוסק אוטומטית)' : ''));
    if (venture.venture_kind) lines.push('המיקוד/היוזמה: ' + venture.venture_kind);
    if (venture.mission) lines.push('המשימה (Mission): ' + venture.mission);
    if (venture.current_goal && venture.current_goal.title) lines.push('היעד הנוכחי: ' + venture.current_goal.title + (venture.current_goal.target_date ? (' (עד ' + venture.current_goal.target_date + ')') : ''));
    var bp = venture.business_profile;
    if (bp) {
      var bpBits = BUSINESS_PROFILE_FIELDS.filter(function (fk) { return bp[fk]; }).map(function (fk) { return fk + ': ' + String(bp[fk]).slice(0, 140); });
      if (bpBits.length) lines.push('פרופיל העסק: ' + bpBits.join(" | "));
    }
    if (state.kpis && state.kpis.length) {
      lines.push('מדדי KPI (בפועל מול יעד): ' + state.kpis.slice(0, 8).map(function (k) {
        return k.name + ': ' + (k.actual == null ? '?' : k.actual) + ' / ' + (k.target == null ? '?' : k.target) + (k.unit ? (' ' + k.unit) : '');
      }).join(" | "));
    }
    var vh = state.dailyBrief && state.dailyBrief.data && state.dailyBrief.data.venture_health;
    if (vh && vh.categories) {
      var vhBits = Object.keys(vh.categories).filter(function (ck) { return vh.categories[ck] && vh.categories[ck].status; }).map(function (ck) { return ck + '=' + vh.categories[ck].status; });
      if (vhBits.length) lines.push('בריאות העסק/המיזם (תדריך אחרון): ' + vhBits.join(", ") + (vh.main_blocker ? (' | מעכב מרכזי: ' + vh.main_blocker) : ''));
    }
    if (venture.knowledge && venture.knowledge.length) {
      lines.push('ידע שכבר נאסף (שוק/מתחרים/מחירים) - אל תחפש שוב אלא אם צריך לעדכן: ' +
        venture.knowledge.slice(-6).map(function (k) { return k.fact; }).join(" | "));
    }
    if (decisions && decisions.length) {
      lines.push('החלטות עסקיות קודמות (מהאחרונה לישנה) - היה עקבי איתן: ' +
        decisions.slice(0, 3).map(function (d) {
          var r = d.recommendation || {};
          return (d.decision && d.decision.title ? d.decision.title : "") + ' → ' + (r.decision || "") + (r.summary ? (": " + r.summary) : "");
        }).join(" | "));
    }
    if (venture.unknowns && venture.unknowns.length) {
      lines.push('דברים שעדיין לא ידועים על המיזם הזה: ' + venture.unknowns.slice(-5).join(" | "));
    }
    if (venture.recent_changes && venture.recent_changes.length) {
      lines.push('שינויים אחרונים בתוכנית: ' + venture.recent_changes.slice(-3).join(" | "));
    }
    // ---- Execution state: active task + completion counts (Section 2/9) ----
    if (state.tasks && state.tasks.length) {
      var doneN = state.tasks.filter(function (tk) { return tk.status === "done"; }).length;
      var activeT = state.tasks.find(function (tk) { return tk.status === "active"; });
      lines.push('התקדמות ביצוע: ' + doneN + ' מתוך ' + state.tasks.length + ' משימות הושלמו.' +
        (activeT ? (' המשימה הפעילה כרגע: "' + activeT.title + '".') : ''));
    }
    // ---- Current bottleneck (Section 5) ----
    if (state.dailyBrief && state.dailyBrief.data && state.dailyBrief.data.bottleneck && state.dailyBrief.data.bottleneck.title) {
      var bn0 = state.dailyBrief.data.bottleneck;
      lines.push('צוואר הבקבוק הנוכחי (חומרה: ' + (bn0.severity || "?") + '): ' + bn0.title);
    }
    // ---- Outcome chain: Goal -> Action -> Expected -> Actual -> Learning (Section 3) ----
    // Reads the structured fields (expected/actual) and falls back to the pre-1.2.0 names.
    if (state.outcomes && state.outcomes.length) {
      lines.push('תוצאות אחרונות בפועל מול הצפוי (הכי חדש קודם) - השתמש בזה כדי ללמוד מה עבד ומה לא: ' +
        state.outcomes.slice(-4).reverse().map(function (o) {
          var ex = o.expected || o.expected_outcome, ac = o.actual || o.actual_outcome;
          var taskT = o.task_id ? (state.tasks.find(function (tk) { return tk.id === o.task_id; }) || {}).title : "";
          return (taskT ? ('משימה: ' + taskT + ' | ') : '') +
            (ex ? ('צפוי: ' + ex) : '') +
            (ac ? (' | בפועל: ' + ac) : '') +
            (o.learning ? (' | לקח: ' + o.learning) : '') +
            (o.recorded_at ? (' (' + o.recorded_at.slice(0, 10) + ')') : '');
        }).join(" || "));
      var learnings = state.outcomes.filter(function (o) { return o && o.learning; }).slice(-3).map(function (o) { return o.learning; });
      if (learnings.length) lines.push('לקחים אחרונים שהיזם למד (חשוב - שקול אם הם משנים הנחות/החלטות קודמות): ' + learnings.join(" | "));
    }
    // ---- Time awareness (P0 #3/#5): computed from ISO timestamps, never stored text ----
    var timeBits = [];
    var nowMs = Date.now();
    if (state.user_timezone) timeBits.push('אזור הזמן של היזם: ' + state.user_timezone);
    timeBits.push('עכשיו (UTC): ' + new Date(nowMs).toISOString().slice(0, 16).replace("T", " "));
    var activeT2 = state.tasks && state.tasks.find(function (tk) { return tk.status === "active"; });
    if (activeT2) {
      var openMs = msSince(taskStartIso(activeT2));
      if (!isNaN(openMs)) timeBits.push('המשימה הפעילה פתוחה כבר ' + Math.round(openMs / HOUR_MS) + ' שעות (' + getTaskAging(activeT2).level + ')');
    }
    if (state.last_activity_at) {
      var idleMs = msSince(state.last_activity_at);
      if (!isNaN(idleMs)) timeBits.push('ימים מאז הפעילות האחרונה של היזם: ' + Math.floor(idleMs / DAY_MS));
    }
    if (venture && venture.execution_started_at) {
      var execMs = msSince(venture.execution_started_at);
      if (!isNaN(execMs)) timeBits.push('ימים מאז תחילת הביצוע: ' + Math.floor(execMs / DAY_MS) + (venture.execution_started_at_backfilled ? ' (הערכה)' : ''));
    }
    if (venture && venture.target_date) {
      var tgtMs = tsMs(venture.target_date);
      if (!isNaN(tgtMs)) timeBits.push('ימים עד תאריך היעד: ' + Math.ceil((tgtMs - nowMs) / DAY_MS));
    }
    if (timeBits.length) lines.push('מצב זמן: ' + timeBits.join(" | "));
    var ctx = "\n" + LIFECYCLE_PRINCIPLE + (lines.length ? ("\nמה שכבר ידוע על העסק/המיזם והיזם (זיכרון APEX):\n" + lines.join("\n") + "\n") : "");
    return ctx + aiLanguageLine();
  }

  function addUnknowns(list) {
    if (!state.venture || !Array.isArray(list) || !list.length) return;
    var existing = state.venture.unknowns || [];
    list.forEach(function (u) { if (u && existing.indexOf(u) === -1) existing.push(u); });
    state.venture = Object.assign({}, state.venture, { unknowns: existing.slice(-15) });
  }

  function addRecentChange(text) {
    if (!state.venture || !text) return;
    var existing = state.venture.recent_changes || [];
    existing.push(new Date().toISOString().slice(0, 10) + ": " + text);
    state.venture = Object.assign({}, state.venture, { recent_changes: existing.slice(-10) });
  }

  function decisionEngineRules(venture, tasks, decisions, question, today) {
    var remaining = tasks.filter(function (t) { return t.status !== "done"; }).map(function (t) { return t.title; });
    return 'את/ה "Decision Engine" - מנוע קבלת החלטות עסקיות בתוך APEX OS, יועץ עסקי קר-רוח ומדויק.\n' +
      'המיזם: "' + venture.title + '". יעד: ' + venture.target_date + '. תאריך היום: ' + today + '. יעד כספי: ' + venture.financial_target + ' ' + venture.financial_unit + '.\n' +
      'משימות פתוחות כרגע: ' + (remaining.length ? remaining.join(", ") : "אין") + '.\n' +
      buildAPEXContext(venture, decisions, "decision") +
      'היזם שואל אותך שאלת החלטה: "' + question + '"\n\n' +
      'נתח את ההחלטה ופלוט אך ורק אובייקט JSON יחיד, בלי שום טקסט לפני או אחרי, בלי markdown, בפורמט הבא בדיוק:\n' +
      '{"schema_version":"1.0","feature":"decision_engine","status":"success",' +
      '"decision":{"title":"כותרת קצרה","question":"' + question.replace(/"/g, "'") + '"},' +
      '"analysis":{"known_facts":["..."],"unknowns":["..."],"risks":["..."]},' +
      '"recommendation":{"decision":"proceed|wait|test|reject|reconsider","summary":"משפט אחד","reason":"1-2 משפטים"},' +
      '"confidence":0.0,' +
      '"expected_outcome":"משפט אחד - מה צפוי לקרות אם פועלים לפי ההמלצה, כדי שאפשר יהיה בהמשך להשוות לתוצאה בפועל",' +
      '"next_action":{"title":"כותרת משימה קונקרטית","steps":["צעד 1 (15-30 דק\')","צעד 2"]}}\n' +
      'ה-"decision" בתוך recommendation חייב להיות אך ורק אחד מהערכים: proceed, wait, test, reject, reconsider - לא טקסט חופשי.\n' +
      'אם באמת אין פעולה מיידית מתבקשת, next_action יכול להיות null. confidence הוא מספר בין 0 ל-1.\n' +
      'יש לך גישה לחיפוש אינטרנט - השתמש בו אם זה עוזר לנתח נכון.';
  }

  function dailyBriefRules(venture, tasks, decisions, today) {
    var doneToday = tasks.filter(function (t) { return t.status === "done" && t.completedAt && t.completedAt.slice(0, 10) === today; }).length;
    var activeTask = tasks.find(function (t) { return t.status === "active"; });
    var doneCount = tasks.filter(function (t) { return t.status === "done"; }).length;
    var lcNow = lifecycleOf(venture);
    var healthCats = healthCatsFor(lcNow);

    } catch (err) { return "he"; }
  }

  }

    if (d.entryStateTimestamp) state.entryStateTimestamp = d.entryStateTimestamp;
    if (Array.isArray(d.outcomes)) state.outcomes = d.outcomes;
    if (d.last_activity_at) state.last_activity_at = d.last_activity_at;
    if (d.onboarding_started_at) state.onboarding_started_at = d.onboarding_started_at;
    if (d.onboarding_completed_at) state.onboarding_completed_at = d.onboarding_completed_at;
    if (d.ventureEvents && typeof d.ventureEvents === "object") state.ventureEvents = d.ventureEvents;
    if ("contextDirty" in d) state.contextDirty = d.contextDirty || null;
    if (typeof d.remindersEnabled === "boolean") state.remindersEnabled = d.remindersEnabled;
    if ("taskReminder" in d) state.taskReminder = d.taskReminder || null;
    if (d.dismissals && typeof d.dismissals === "object") state.dismissals = d.dismissals;
    if (Array.isArray(d.kpis)) state.kpis = d.kpis;
    if (Array.isArray(d.kpiDismissed)) state.kpiDismissed = d.kpiDismissed;
    if (d.progressCollapsed && typeof d.progressCollapsed === "object") state.progressCollapsed = d.progressCollapsed;
    normalizeState();
  }

  // One-time, idempotent backfill of v1.2.0 fields on data saved by older versions.
  // Uses the best available proxy and marks estimates so they're never recomputed.
  function normalizeState() {
    try { state.user_timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || state.user_timezone || null; } catch (e) {}
    if (!Array.isArray(state.tasks)) state.tasks = [];
    if (!Array.isArray(state.outcomes)) state.outcomes = [];
    if (!Array.isArray(state.decisions)) state.decisions = [];
    if (!state.ventureEvents || typeof state.ventureEvents !== "object") state.ventureEvents = { pending: [], last_refresh_at: null };
    if (!Array.isArray(state.ventureEvents.pending)) state.ventureEvents.pending = [];
    if (!state.dismissals || typeof state.dismissals !== "object") state.dismissals = {};
    // prune dismissals older than ~2 weeks (keys are local dates or versions)
    var cutoff = new Date(Date.now() - 14 * DAY_MS).toISOString().slice(0, 10);
    Object.keys(state.dismissals).forEach(function (k) {
      var val = state.dismissals[k];
      if (typeof val === "string" && /^\d{4}-\d{2}-\d{2}$/.test(val) && val < cutoff) delete state.dismissals[k];
    });
    // Tasks: created_at from id, completed_at <-> completedAt (old name still written/read),
    // started_at for the active task = when the previous task was completed (the moment it
    // became active), else its created_at.
    var prevDoneAt = null;
    state.tasks = state.tasks.map(function (tk) {
      if (!tk || typeof tk !== "object") return tk;
      var patch = {};
      if (!tk.created_at) patch.created_at = tsFromId(tk.id) || null;
      if (!tk.completed_at && tk.completedAt) patch.completed_at = tk.completedAt;
      if (tk.status === "active" && !tk.started_at) {
        patch.started_at = prevDoneAt || tk.created_at || patch.created_at || nowIso();
        patch.started_at_estimated = true;
      }
      if (!tk.updated_at) patch.updated_at = tk.completedAt || tk.created_at || patch.created_at || null;
      if (tk.status === "done" && (tk.completedAt || tk.completed_at)) prevDoneAt = tk.completedAt || tk.completed_at;
      return Object.keys(patch).length ? Object.assign({}, tk, patch) : tk;
    });
    // Decisions: decided_at (when APEX gave the recommendation), review_date optional.
    state.decisions = state.decisions.map(function (d) {
      if (!d || typeof d !== "object" || d.decided_at) return d;
      return Object.assign({}, d, { decided_at: d.created_at || tsFromId(d.id) || null, review_date: d.review_date || null });
    });
    // Outcomes: structured shape {id, task_id, expected, actual, learning, evidence, recorded_at, source};
    // old field names (expected_outcome/actual_outcome) are kept readable, never removed.
    state.outcomes = state.outcomes.map(function (o) {
      if (!o || typeof o !== "object" || o.source) return o;
      return Object.assign({}, o, {
        expected: o.expected != null ? o.expected : (o.expected_outcome || ""),
        actual: o.actual != null ? o.actual : (o.actual_outcome || ""),
        evidence: Array.isArray(o.evidence) ? o.evidence : [],
        source: "founder",
      });
    });
    // Venture: created_at / execution_started_at / updated_at.
    if (state.venture && !state.venture.execution_started_at) {
      var earliest = null;
      state.tasks.forEach(function (tk) {
        var c = tk && (tk.created_at || tsFromId(tk.id));
        if (c && (!earliest || c < earliest)) earliest = c;
      });
      var proxy = earliest || state.onboarding_completed_at || nowIso();
      state.venture = Object.assign({}, state.venture, {
        created_at: state.venture.created_at || state.entryStateTimestamp || proxy,
        execution_started_at: proxy,
        execution_started_at_backfilled: true,
        updated_at: state.venture.updated_at || state.last_activity_at || proxy,
      });
    }
    // ---- v1.3.0: lifecycle defaults (idempotent; never overwrite explicit values) ----
    if (!Array.isArray(state.kpis)) state.kpis = [];
    state.kpis = state.kpis.filter(function (k) { return k && typeof k === "object" && k.name; }).map(function (k) {
      return k.id ? k : Object.assign({}, k, { id: "k" + Math.random().toString(36).slice(2, 9) });
    });
    if (!Array.isArray(state.kpiDismissed)) state.kpiDismissed = [];
    if (!state.progressCollapsed || typeof state.progressCollapsed !== "object") state.progressCollapsed = {};
    if (state.venture) {
      var vp = {};
      if (!state.venture.entry_state && state.entryState) vp.entry_state = state.entryState;
      if (LIFECYCLE_STAGES.indexOf(state.venture.lifecycle_stage) === -1) {
        vp.lifecycle_stage = inferLifecycle(Object.assign({}, state.venture, vp));
        vp.lifecycle_stage_inferred = true;
      }
      if (!state.venture.business_profile || typeof state.venture.business_profile !== "object") vp.business_profile = emptyBusinessProfile();
      if (!Array.isArray(state.venture.lifecycle_history)) vp.lifecycle_history = [];
      if (state.venture.venture_kind && VENTURE_KINDS.indexOf(state.venture.venture_kind) === -1) vp.venture_kind = null;
      if (Object.keys(vp).length) state.venture = Object.assign({}, state.venture, vp);
    }
  }

  // P1 #18: a real, structured JSON download (not a long text). A human-readable
  // Venture Report is a separate, later feature.
  function exportData() {
    var payload = buildExport();
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "apex-export-" + todayLocal() + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) {} }, 1500);
    showToast(t("export_done_toast"));
  }
  var toastTimer = null;
  function showToast(msg) {
    state.shareToast = msg;
    render();
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { state.shareToast = null; render(); }, 3000);
  }

  // ---- AI output helpers (Phase 0: shared JSON parsing + action dispatch,
  // used by future structured AI features like Decision Engine) ----
  function parseAiJson(text, requiredFields) {
    var match = text.match(/\{[\s\S]*\}/);
    if (!match) return null;
    var obj;
    try { obj = JSON.parse(match[0]); } catch (err) { return null; }
    var fields = requiredFields || [];
    for (var i = 0; i < fields.length; i++) {
      if (!(fields[i] in obj)) return null;
    }
    return obj;
  }

  var AUTO_ACTIONS = { create_task: true };

  // ---- Smart Context Refresh (P0 #5) ----
  // Significant events are queued here instead of triggering an AI call each time.
  // fetchDailyBriefIfNeeded() refreshes the brief/bottleneck when the day changes OR
  // when there's a pending significant event and >= EVENT_REFRESH_MIN_MS has passed.
  // Trivial events (e.g. completing a task without an outcome) never call this.
  var EVENT_REFRESH_MIN_MS = 3 * HOUR_MS;
  function markVentureEvent(type, detail) {
    if (!state.venture) return;
    var ev = state.ventureEvents || { pending: [], last_refresh_at: null };
    var pending = (ev.pending || []).concat([{ type: type, detail: String(detail || "").slice(0, 160), at: nowIso() }]).slice(-20);
    state.ventureEvents = { pending: pending, last_refresh_at: ev.last_refresh_at || null };
    persist();
    fetchDailyBriefIfNeeded(); // self-gated: no call unless the interval has passed
  }

  // ---- Outcome -> Memory (P0 #4): cheap LOCAL significance check, no AI ----
  var SIGNIFICANT_KEYWORDS = ["מחיר", "תמחור", "יקר", "זול", "לקוח", "לקוחות", "ביקוש", "מתחר", "הכנס", "מכיר", "ספק", "קהל",
    "price", "pricing", "expensive", "cheap", "customer", "client", "demand", "competit", "revenue", "sales", "supplier", "audience"];
  function normText(s) { return String(s || "").toLowerCase().replace(/[\s.,!?"'״׳:;()-]+/g, " ").trim(); }
  function outcomeSignificance(expected, actual, learning) {
    if (learning && learning.trim()) return "learning";
    if (actual && expected && normText(actual) !== normText(expected)) return "expectation_gap";
    var hay = normText(actual + " " + learning);
    for (var i = 0; i < SIGNIFICANT_KEYWORDS.length; i++) {
      if (hay.indexOf(SIGNIFICANT_KEYWORDS[i]) !== -1) return "keyword:" + SIGNIFICANT_KEYWORDS[i];
    }
    return null;
  }
  function flagContextDirty(reason, refId) {
    state.contextDirty = { reason: reason, at: nowIso(), ref_id: refId || null, suggestion_dismissed: false };
  }

  function insertActionTask(title, steps) {
    var now0 = nowIso();
    var newTask = { id: "t" + Date.now() + "_action", title: title, steps: steps || [], links: [], status: "active",
      created_at: now0, updated_at: now0, started_at: now0, completed_at: null, last_activity_at: now0 };
    touchActivity();
    var idx = state.tasks.findIndex(function (t) { return t.status === "active"; });
    if (idx === -1) {
      // no active task (e.g. all done) - just append and activate
      state.tasks = state.tasks.concat([newTask]);
    } else {
      var next = state.tasks.slice();
      next[idx] = stampTask(next[idx], { status: "locked" });
      next.splice(idx, 0, newTask);
      state.tasks = next;
    }
    persist();
    render();
  }

  function applyAction(action, onConfirmNeeded) {
    if (!action || !action.type) return false;
    if (AUTO_ACTIONS[action.type]) {
      if (action.type === "create_task") {
        insertActionTask(action.title, action.steps);
      }
      return true;
    }
    if (typeof onConfirmNeeded === "function") onConfirmNeeded(action);
    return false;
  }

  // opts.retryOfId: id of a previously failed decision card to replace (no duplicate cards).
  async function fetchDecision(question, opts) {
    opts = opts || {};
    if (!state.venture || state.decisionLoading || !question) return;
    if (opts.retryOfId) {
      state.decisions = state.decisions.filter(function (d) { return d.id !== opts.retryOfId; });
    }
    state.decisionLoading = true;
    state.decisionRetryingId = opts.retryOfId || null;
    touchActivity();
    render();
    try {
      var today = new Date().toISOString().slice(0, 10);
      var reply = await ask(decisionEngineRules(state.venture, state.tasks, state.decisions, question, today), true, "decision_engine");
      var parsed = parseAiJson(reply, ["recommendation", "confidence"]);
      if (parsed) {
        parsed.id = "d" + Date.now();
        parsed.applied = false;
        // ---- Section 4: Decision Ledger fields ----
        parsed.created_at = new Date().toISOString();
        parsed.decided_at = parsed.created_at; // when APEX gave the recommendation
        parsed.review_date = null;             // optional, set later if a review is scheduled
        parsed.status = "open"; // open -> resolved once actual_outcome/learning are recorded
        state.decisions = [parsed].concat(state.decisions);
        if (parsed.analysis && Array.isArray(parsed.analysis.unknowns)) addUnknowns(parsed.analysis.unknowns);
        if (parsed.recommendation && parsed.recommendation.summary) {
          addRecentChange('החלטה על "' + question + '": ' + parsed.recommendation.summary);
        }
        state.decisionLoading = false;
        markVentureEvent("new_decision", question);
      } else {
        state.decisions = [{ id: "d" + Date.now(), decision: { title: question }, recommendation: { decision: "reconsider", summary: t("err_decision_parse"), reason: "" }, confidence: 0, applied: false, parseFailed: true, retry: { kind: "decision", arg: question } }].concat(state.decisions);
      }
      persist();
    } catch (err) {
      var failMsg = (err && err.code === "auth_required") ? t("err_need_login_replan") : (opts.retryOfId ? t("err_retry_failed") : t("err_generic"));
      state.decisions = [{ id: "d" + Date.now(), decision: { title: question }, recommendation: { decision: "reconsider", summary: failMsg, reason: "" }, confidence: 0, applied: false, parseFailed: true, retry: { kind: "decision", arg: question } }].concat(state.decisions);
      persist();
    }
    state.decisionLoading = false;
    state.decisionRetryingId = null;
    render();
  }

  // ---- Section 4: Decision Ledger - record actual outcome + learning against a decision.
  // Explicit save action from the user (never inferred/auto-filled by the AI) - same
  // confirm-before-apply spirit as apply-decision/bottleneck-create-task (Section 12).
  function recordDecisionOutcome(decisionId, actualOutcome, learning) {
    var dec = state.decisions.find(function (d) { return d.id === decisionId; });
    if (!dec) return;
    dec.actual_outcome = actualOutcome || "";
    dec.learning = learning || "";
    dec.status = "resolved";
    dec.resolved_at = new Date().toISOString();
    if (learning) addRecentChange('לקח מהחלטה "' + (dec.decision && dec.decision.title) + '": ' + learning);
    state.decisionOutcomeOpenId = null;
    touchActivity();
    var sig = outcomeSignificance(dec.expected_outcome, actualOutcome, learning);
    if (sig) {
      flagContextDirty("decision_outcome:" + sig, decisionId);
      markVentureEvent("decision_outcome", (dec.decision && dec.decision.title) || "");
    }
    persist();
    render();
  }

  // ---- Section 3: Outcome Engine - record a lightweight Expected vs Actual entry,
  // optionally tied to the task that was just completed. Explicit, skippable (Section 3
  // asks to keep this light - no big new screen, just an inline optional capture).
  function recordOutcome(taskId, expectedOutcome, actualOutcome, learning) {
    if (!actualOutcome && !learning) { state.taskFlashOutcomeOpen = false; render(); return; }
    var entry = {
      id: "o" + Date.now(),
      task_id: taskId || null,
      goal_ref: (state.venture && state.venture.title) || null,
      // P0 #4 structured outcome
      expected: expectedOutcome || "",
      actual: actualOutcome || "",
      learning: learning || "",
      evidence: [],
      recorded_at: new Date().toISOString(),
      source: "founder",
      // pre-1.2.0 names kept so older readers/exports keep working
      expected_outcome: expectedOutcome || "",
      actual_outcome: actualOutcome || "",
      status: "recorded",
    };
    state.outcomes = state.outcomes.concat([entry]).slice(-50);
    if (learning) addRecentChange("לקח מתועד: " + learning);
    state.taskFlashOutcomeOpen = false;
    if (state.taskFlash) state.taskFlash = Object.assign({}, state.taskFlash, { outcomeSaved: true });
    touchActivity();
    var sig = outcomeSignificance(entry.expected, entry.actual, entry.learning);
    if (sig) {
      entry.significance = sig;
      flagContextDirty("outcome:" + sig, entry.id);
      markVentureEvent("outcome", (entry.learning || entry.actual));
    }
    persist();
    render();
  }

  async function fetchDailyBriefIfNeeded() {
    if (!state.venture || state.briefLoading || !state.user) return;
    var today = new Date().toISOString().slice(0, 10);
    var ev = state.ventureEvents || { pending: [] };
    var dueByDate = !(state.dailyBrief && state.dailyBrief.date === today);
    var lastRefreshMs = tsMs(ev.last_refresh_at);
    var dueByEvent = (ev.pending || []).length > 0 && (isNaN(lastRefreshMs) || (Date.now() - lastRefreshMs) >= EVENT_REFRESH_MIN_MS);
    if (!dueByDate && !dueByEvent) return;
    // Back off after a failure so the periodic check never hammers the AI endpoint.
    if (state.briefFailedAt && (Date.now() - state.briefFailedAt) < 15 * 60 * 1000) return;
    state.briefLoading = true;
    var pendingSnapshot = (ev.pending || []).length;
    try {
      var reply = await ask(dailyBriefRules(state.venture, state.tasks, state.decisions, today), false, "daily_brief");
      var parsed = parseAiJson(reply, ["recommendation"]);
      if (parsed) {
        state.dailyBrief = { date: today, data: parsed, refreshed_at: nowIso(), trigger: dueByDate ? "date" : "event" };
        // Clear only the events this refresh covered (new ones may have arrived meanwhile).
        var cur = state.ventureEvents || { pending: [] };
        state.ventureEvents = { pending: (cur.pending || []).slice(pendingSnapshot), last_refresh_at: nowIso() };
        state.briefFailedAt = 0;
        persist();
        render();
      } else {
        state.briefFailedAt = Date.now();
      }
    } catch (err) {
      // silent fail - dashboard just won't show a brief today
      state.briefFailedAt = Date.now();
    }
    state.briefLoading = false;
  }


  function restore() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var saved = JSON.parse(raw);
        applySnapshot(saved);
      }
    } catch (err) {}
    normalizeState();
    state.ready = true;
    applyDocumentDirection();
  }

  async function saveRemoteData() {
    if (!supabaseClient || !state.user) return;
    try {
      state.syncStatus = "saving";
      await supabaseClient.from("user_data").upsert({ user_id: state.user.id, data: dataSnapshot() }, { onConflict: "user_id" });
      state.syncStatus = "saved";
    } catch (err) {
      state.syncStatus = "error";
    }
  }

  async function loadRemoteData() {
    if (!supabaseClient || !state.user) return;
    try {
      var res = await supabaseClient.from("user_data").select("data").eq("user_id", state.user.id).maybeSingle();
      if (res.data && res.data.data) {
        var d = res.data.data;
        applySnapshot(d);
        applyDocumentDirection();
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(dataSnapshot())); } catch (e) {}
      } else {
        saveRemoteData();
      }
    } catch (err) {}
    render();
  }

  function signInWithGoogle() {
    if (!supabaseClient) return;
    supabaseClient.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.href } });
  }

  async function signOutUser() {
    if (!supabaseClient) return;
    await supabaseClient.auth.signOut();
    state.user = null;
    render();
  }

  async function initAuth() {
    if (!supabaseClient) return;
    try {
      var sessionRes = await supabaseClient.auth.getSession();
      state.user = (sessionRes.data && sessionRes.data.session && sessionRes.data.session.user) || null;
      if (state.user) { await loadRemoteData(); }
      render();
    } catch (err) {}
    supabaseClient.auth.onAuthStateChange(function (event, session) {
      state.user = (session && session.user) || null;
      render();
      if (state.user) loadRemoteData();
    });
  }

  async function ask(promptText, useSearch, actionName) {
    if (!supabaseClient) { var errNb = new Error("no_backend"); errNb.code = "api_error"; throw errNb; }
    if (!state.user) { var errAuth = new Error("auth_required"); errAuth.code = "auth_required"; throw errAuth; }
    var res;
    try {
      res = await supabaseClient.functions.invoke("ask-claude", { body: { prompt: promptText, useSearch: !!useSearch, action: actionName || "unknown" } });
    } catch (err) {
      var errNet = new Error("api_error: " + (err && err.message));
      errNet.code = "api_error";
      throw errNet;
    }
    if (res.error) {
      var err2 = new Error("api_error: " + res.error.message);
      err2.code = "api_error";
      throw err2;
    }
    return (res.data && res.data.text) || "";
  }

  function chooseEntryState(value, label) {
    if (!ENTRY_STATE_OPENINGS[value]) return;
    var isChange = !!state.entryState && state.entryState !== value;
    state.entryStatePrevious = state.entryState;
    state.entryState = value;
    state.entryStateTimestamp = new Date().toISOString();
    state.entryStateJustChanged = isChange;
    persist();
    runOnboardTurn(label);
  }

  // opts.isRetry: the user message is already in state.messages (appended by the failed
  // attempt) - drop the trailing error bubble and re-run without appending it again.
  async function runOnboardTurn(visibleUserText, opts) {
    opts = opts || {};
    if (state.sending) return; // in-flight guard: no double submission
    if (opts.isRetry) {
      var lastM = state.messages[state.messages.length - 1];
      if (lastM && lastM.error) state.messages = state.messages.slice(0, -1);
      var prevM = state.messages[state.messages.length - 1];
      if (!prevM || prevM.role !== "user" || prevM.content !== visibleUserText) {
        state.messages = state.messages.concat([{ role: "user", content: visibleUserText }]);
      }
    } else {
      state.messages = state.messages.concat([{ role: "user", content: visibleUserText }]);
    }
    if (!state.onboarding_started_at) state.onboarding_started_at = state.entryStateTimestamp || nowIso();
    touchActivity();
    state.sending = true;
    render();
    try {
      var today = new Date().toISOString().slice(0, 10);
      var rules = ONBOARD_RULES + entryStateBlock(state.entryState, state.entryStateJustChanged, state.entryStatePrevious) + aiLanguageLine() + "\n\nתאריך היום: " + today;
      state.entryStateJustChanged = false;
      var reply = await ask(buildPrompt(rules, state.messages), true, "onboarding");
      var extracted = extractTag(reply, "VENTURE");
      var displayText = stripTags(reply) || "...";
      if (/<VENTURE>/.test(reply) && !extracted) {
        displayText = t("err_truncated_venture");
      }
      state.messages = state.messages.concat([{ role: "assistant", content: displayText }]);
      if (extracted && Array.isArray(extracted.tasks) && extracted.tasks.length > 0) {
        var execNow = nowIso();
        state.onboarding_completed_at = execNow;
        state.venture = {
          created_at: execNow,
          execution_started_at: execNow, // onboarding finished -> venture moves into execution
          updated_at: execNow,
          onboarding_started_at: state.onboarding_started_at || state.entryStateTimestamp || null,
          onboarding_completed_at: execNow,
          title: extracted.title, target_date: extracted.target_date,
          financial_target: extracted.financial_target || 0, financial_unit: extracted.financial_unit || "₪",
          core_why: extracted.core_why || "", founder_name: extracted.founder_name || "",
          founder_dna: extracted.founder_dna || null,
          entry_state: state.entryState || null,
          knowledge: [], unknowns: [], recent_changes: [],
          // v1.3.0 lifecycle: AI-assessed stage, else from the entry state (initial context only)
          lifecycle_stage: LIFECYCLE_STAGES.indexOf(extracted.lifecycle_stage) !== -1 ? extracted.lifecycle_stage : (ENTRY_TO_LIFECYCLE[state.entryState] || "idea"),
          lifecycle_stage_inferred: false,
          lifecycle_history: [],
          venture_kind: VENTURE_KINDS.indexOf(extracted.venture_kind) !== -1 ? extracted.venture_kind : null,
          mission: extracted.mission ? String(extracted.mission) : "",
          current_goal: extracted.current_goal ? { title: String(extracted.current_goal), target_date: extracted.target_date || null, set_at: execNow } : null,
          business_profile: normalizeBusinessProfile(extracted.business_profile),
          cycle_count: 1,
        };
        state.venture.lifecycle_history = [{ stage: state.venture.lifecycle_stage, from: null, at: execNow, source: "onboarding" }];
        state.tasks = makeTasks(extracted.tasks);
        state.replanMessages = [{ role: "assistant", content: (isBusinessStage(state.venture.lifecycle_stage)
          ? ("התוכנית ל\"" + extracted.title + "\" מוכנה - מתחילים מהשיפור החשוב ביותר עכשיו. עדכן אותי כאן על כל מה שקורה בעסק.")

    if (state.showResetConfirm) { state.showResetConfirm = false; render(); return true; }
    if (state.showBackConfirm) { state.showBackConfirm = false; render(); return true; }
    if (state.replanExpanded) { state.replanExpanded = false; render(); return true; }
    if (state.shareSheet) { state.shareSheet = null; render(); return true; }
    if (state.phase === "dashboard" && state.venture && !state.mapReadyPending && state.screen !== "home") {
      var hist = state.screenHistory || [];
      var prev = hist.length ? hist[hist.length - 1] : "home";
      state.screenHistory = hist.slice(0, -1);
      if (!prev || prev === state.screen) prev = "home";
      state.screen = prev;
      render();
      return true;
    }
    return false;
  }
  function isRootView() {
    if (state.showResetConfirm || state.showBackConfirm || state.replanExpanded || state.shareSheet) return false;
    return !(state.phase === "dashboard" && state.venture && !state.mapReadyPending && state.screen !== "home");
  }
  // Android hardware back: keep exactly one same-URL history entry while in a

  var historyArmed = false;
  function syncHistory() {
    try {
      if (!historyArmed && !isRootView() && window.history && history.pushState) {
        history.pushState({ apexNav: 1 }, "");
        historyArmed = true;
      }
    } catch (e) {}
  }
  window.addEventListener("popstate", function () {
    if (!historyArmed) return;
    historyArmed = false;
    goBack(); // render() -> syncHistory() re-arms if still in a non-root view
  });
